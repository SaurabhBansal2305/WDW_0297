<!DOCTYPE html>
<html>
    <head>
    <title align="center">Experiment 4</title>
    </head>
    <body>
        <table border="3" align="center" height="250" width="50%">
            <td>
            <h1 align="center">Hotel Room Booking Form</h1>
            <form>
                <center>
                <fieldset>
                   <legend align="center"><b>Personal Information</b></legend>
                    <br>
                    <label  for="name" >Full Name:</label>
                    <input  type="text" id="name" name="name" required>
                    <br><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <br><br>
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" required>
                    <br><br>
                </fieldset>
                <fieldset>
                    <legend align="center"><b>Booking Details</b></legend>
                    <br>
                    <label for="checkin">Check-in Date:</label>
                    <input type="date" id="checkin" name="checkin" required>
                    <br><br>
                    <label for="checkout">Check-out Date:</label>
                    <input type="date" id="checkout" name="checkout" required>
                    <br><br>
                    <label for="roomtype">Room Type:</label>
                    <select id="roomtype" name="roomtype" required>
                        <option>Single Room</option>
                        <option>Double Room</option>
                        <option>Triple Room</option>
                    </select>
                    <br><br>
                    <label for="guest">Number of Guests:</label>
                    <input type="number" id="guest" name="guest" min="1" required>
                    <br><br>
                    <label for="request">Special Request:</label>
                    <br>
                    <textarea id="request" name="request" rows="5" cols="50"></textarea>
                    </fieldset>
                    <br>
                    <button type="submit">Book Now</button>
                    <button type="reset">Reset Form</button>
                    <br>
                </center>
            </form>
            </td>
        </table>
     </body>
</html>
