<!DOCTYPE html>
<html>
    <head>
        <title align="center">Experiment - 5</title>
    </head>
    <body>
       <table align="center" border="3" width="100" height="100" cellpadding="10">
            <td>
                <h1 align="center">Student Registration Form</h1>
                <hr>
                 <form >
                <label for="name">Full Name:</label>
                <input type="name" id="name" name="Student name" placeholder="Enter your full name" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email " name="email" placeholder="Enter valid email address" required>
                <br><br>
                <label for="passworrd">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
                <br><br>
                <label for="gender" >Gender:</label>
                <input type="radio" id="gender" name="gender" required>Male
                <input type="radio" id="gender" name="gender" required>Female
                <input type="radio" id="gender" name="gender" required>Other
                <br><br>
                <label for="course">Course:</label>
                <select id="course" name="course" required>
                    <option>--Select Course--</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>BA</option>
                    <option>BSc</option>
                    <option>M.Tech</option>
                    <option>MCA</option>
                    <option>MA</option>
                    <option>MSc</option>
                    <option>MA</option>
                </select>
                <br><br>
                <label for="mobile">Contact No:</label>
                <input type="tel" id="mobile" name="contact no." placeholder="Enter phone number" required>
                <br><br>
                <label for="address">Address:</label>
                <br>
                <textarea id="address" name="address" placeholder="Enter your address" rows="5" cols="50" required></textarea>
                <br><br>
                <button type="submit">Register</button>
                <button type="rest">Clear</button>
            </form>
            
            <hr>
            <p align="center">&copy; 2026 Student Registration Portal</p>
        </td>
    </table>
    </body>
</html>
